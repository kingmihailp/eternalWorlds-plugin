name: EternalWorldsPortals
version: '1.0.0'
main: com.eternalworlds.portals.EternalWorldsPlugin
api-version: '1.21'
description: Custom portal system for server administrators
authors:
  - EternalWorlds

commands:
  portal:
    description: Manage custom world portals
    usage: /portal <subcommand>
    permission: eternalworlds.portal.admin
    aliases: [eternalportals]
  stats:
    description: View your statistics for a counter
    usage: /stats <counter-name>
    permission: eternalworlds.stats.use
  npc:
    description: NPC management (reload, etc.)
    usage: /npc <subcommand>
    permission: eternalworlds.npc.admin
  spawnnpc:
    description: Spawn a player-model NPC at your location
    usage: /spawnnpc <id>
    permission: eternalworlds.npc.admin
  removenpc:
    description: Remove a player-model NPC
    usage: /removenpc <id>
    permission: eternalworlds.npc.admin
  npcattributes:
    description: Configure NPC attributes (name, skin, command, look-at-nearest)
    usage: /npcattributes <id> <attribute> <value>
    permission: eternalworlds.npc.admin
  setnpcitems:
    description: Set NPC equipment from your main hand
    usage: /setnpcitems <id> <slot>
    permission: eternalworlds.npc.admin

permissions:
  eternalworlds.portal.admin:
    description: Full access to portal management (create, delete, enable/disable)
    default: op
  eternalworlds.portal.use:
    description: Ability to travel through portals
    default: true
  eternalworlds.stats.use:
    description: Ability to view personal statistics
    default: true
  eternalworlds.npc.admin:
    description: Full access to NPC management (spawn, remove, configure)
    default: op
