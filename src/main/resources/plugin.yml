name: EternalWorldsPortals
version: '${project.version}'
main: com.eternalworlds.portals.EternalWorldsPlugin
api-version: '1.21'
description: Custom portal system for server administrators
authors:
  - EternalWorlds

commands:
  portal:
    description: Manage custom world portals
    usage: /portal <subcommand>
    permission: eternalworlds.portal.admin
    aliases: [eternalportals]
  stats:
    description: View your statistics for a counter
    usage: /stats <counter-name>
    permission: eternalworlds.stats.use

permissions:
  eternalworlds.portal.admin:
    description: Full access to portal management (create, delete, enable/disable)
    default: op
  eternalworlds.portal.use:
    description: Ability to travel through portals
    default: true
  eternalworlds.stats.use:
    description: Ability to view personal statistics
    default: true
