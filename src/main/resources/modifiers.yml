# modifiers.yml — Game modifier definitions for EternalWorldsPortals.
#
# A modifier is selected with /modifiers <name> during the COUNTDOWN phase
# and is applied the moment the game starts (GAME_RUNNING).
#
# Fields:
#   display-name  — shown in chat when the modifier is selected / applied.
#                   Supports & color codes and &#RRGGBB hex colors.
#   description   — one-line description shown alongside the name (optional).
#   commands      — console commands dispatched when the game starts.
#                   Placeholders: {portal}, {world}.
#
# Modifiers whose name matches a registered built-in effect (such as "anvil-rain")
# also trigger that effect's code logic in addition to any listed commands.

modifiers:
  anvil-rain:
    display-name: "&#888888&lДождь из наковален"
    description: "Наковальни падают с неба на игроков!"
    commands: []
  randomization:
    display-name: "&#AA00FF&lРандомизация"
    description: "Весь дроп с блоков и мобов перемешан!"
    commands: []
  swapper:
    display-name: "&#FF55FF&lСваппер"
    description: "Каждые 15 секунд игроки меняются местами!"
    commands: []
  floor-is-lava:
    display-name: "&#FF4400&lПол — это лава"
    description: "Лава медленно поднимается снизу!"
    commands: []
  chaos:
    display-name: "&#FF0000&lРежим хаоса"
    description: "Рандомные блоки и мобы появляются в мире!"
    commands: []
  effect-fever:
    display-name: "&#FF00FF&lЛихорадка эффектов"
    description: "Каждые 4 секунды на игроков накладывается случайный эффект!"
    commands: []
  fair-play:
    display-name: "&#00AA00&lЧестная игра"
    description: "Каждые 4 секунды всем игрокам выдаётся один и тот же рандомный предмет!"
    commands: []
  pushers:
    display-name: "&#55FFFF&lПоталкушки"
    description: "Палка x100 откидывание, элитры и заряд ветра каждые 4 секунды!"
    commands: []
  meteor-rain:
    display-name: "&#FF4400&lМетеоритный дождь"
    description: "Огненные метеориты падают в радиусе 25 блоков от центра мира!"
    commands: []
  mobification:
    display-name: "&#55FF55&lМобификация"
    description: "Каждые 4 секунды вместо предметов выдаются яйца призыва мобов!"
    commands: []
  overflow:
    display-name: "&#FFAA00&lПереполнение"
    description: "Вместо одного предмета выпадает сразу 64!"
    commands: []
